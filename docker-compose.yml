services:
  postgres:
    image: postgres:17
    container_name: quimiport-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: quimiport
      POSTGRES_PASSWORD: quimiport_dev
      POSTGRES_DB: quimiport

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quimiport -d quimiport"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: