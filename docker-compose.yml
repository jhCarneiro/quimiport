services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: quimiport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quimiport_dev}
      POSTGRES_DB: quimiport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quimiport -d quimiport"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://quimiport:${POSTGRES_PASSWORD:-quimiport_dev}@postgres:5432/quimiport?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
volumes:
  postgres_data:
